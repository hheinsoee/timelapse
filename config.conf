# timelapse config — read by run.sh and capture.sh on every start.
# Command line flags still win: ./run.sh --exposure 60 overrides EXPOSURE here.
# Values are shell assignments; quote anything with spaces.

# ----------------------------------------------------------------- camera --
CAMERA="EMEET SmartCam C960 2K"   # ffmpeg -f avfoundation -list_devices true -i ""
SIZE="2560x1440"                  # full sensor. 1920x1080 is the same view, fewer pixels
INTERVAL=""                       # seconds between frames; empty -> ask on start
FPS=30                            # frame rate of the video built on exit

# ------------------------------------------------------------------ focus --
# auto-lock  let autofocus settle during warm-up, then freeze it
# 1-1023     fixed focus position (low = near, high = far)
# off        leave autofocus running
FOCUS="off"

# ------------------------------------------------ exposure = shutter speed --
# Shutter time in units of 0.1 ms. This is the only brightness knob that
# matters; there is no separate "exposure" control on this camera.
#
#   20   =  2.0ms   very dark room, strong clouds through a window
#   40   =  4.0ms   bright overcast sky keeps its cloud shape
#   140  = 14.0ms   normal indoor light
#   157  = 15.7ms   the camera's own default
#   300  = 30.0ms   dim room
#   auto            leave auto-exposure running (brightness will flicker)
#
# Pick yours with:  ./capture.sh --bracket
EXPOSURE="auto"

# Sensor gain 0-100. 0 = cleanest image; raise it to brighten without
# lengthening the shutter. Empty = leave the camera's value alone.
GAIN=0

# Brightness offset -64..64. Empty = leave alone.
BRIGHTNESS=0

# ---------------------------------------------------------- white balance --
# lock         freeze whatever auto white balance settled on during warm-up
# 2300-6500    fixed colour temperature in Kelvin (4600 = camera default)
# auto         leave auto white balance running (colour can drift/flicker)
WHITE_BALANCE="auto"

# ----------------------------------------------------------------- timing --
WARMUP=4                          # seconds of streaming before the controls are set
